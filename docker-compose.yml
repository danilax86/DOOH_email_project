version: "3.8"

services:
  dooh:
    build: .
    image: dooh
    container_name: DOOH
    ports:
      - "7860:5000"
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      JOB_DB_PATH: /app/app/data/email_jobs.sqlite3
    volumes:
      - dooh_data:/app/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  email-worker:
    build: .
    image: dooh
    container_name: DOOH-worker
    restart: unless-stopped
    command: ["python", "-m", "app.email_worker"]
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      JOB_DB_PATH: /app/app/data/email_jobs.sqlite3
    volumes:
      - dooh_data:/app/app/data
    depends_on:
      - dooh

volumes:
  dooh_data:
