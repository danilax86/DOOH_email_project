services:
  dooh:
    build: .
    image: dooh
    container_name: DOOH
    ports:
      - "7860:5000"
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - SMTP_TIMEOUT_SECONDS=30
      - SMTP_DEBUG_LEVEL=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
